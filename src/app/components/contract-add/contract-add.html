<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card p-4 p-md-5 border-0 shadow-sm bg-white">
        <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
          <div class="bg-primary text-white p-2 rounded d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
            <i class="bi bi-file-earmark-text fs-4"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0">Register Maintenance Contract</h4>
            <p class="text-muted mb-0 small">Configure contract terms and scheduled visits</p>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mb-3">{{ errorMessage }}</div>

        <form [formGroup]="contractForm" (ngSubmit)="onSubmit()">
          
          <!-- Contract Name -->
          <div class="mb-3">
            <label class="form-label text-muted small fw-medium">Contract Name</label>
            <input type="text" formControlName="name" class="form-control bg-light" placeholder="e.g. LE MOTEUR STANDARD"
                   [class.is-invalid]="contractForm.get('name')?.touched && contractForm.get('name')?.invalid">
            <div class="text-danger small mt-1" *ngIf="contractForm.get('name')?.touched && contractForm.get('name')?.hasError('required')">Name is required.</div>
          </div>

          <!-- Redevance term -->
          <div class="mb-3">
            <label class="form-label text-muted small fw-medium">Redevance (Payment Term)</label>
            <select formControlName="redevance" class="form-select bg-light"
                    [class.is-invalid]="contractForm.get('redevance')?.touched && contractForm.get('redevance')?.invalid">
              <option value="" disabled>-- Choose Term --</option>
              <option value="ANNUELLE">ANNUELLE (6 Visits/Year)</option>
              <option value="SEMESTRIELLE">SEMESTRIELLE (2 Visits/Year)</option>
              <option value="TRIMESTRIELLE">TRIMESTRIELLE (4 Visits/Year)</option>
            </select>
            <div class="text-danger small mt-1" *ngIf="contractForm.get('redevance')?.touched && contractForm.get('redevance')?.hasError('required')">Term selection is required.</div>
          </div>

          <!-- Signature Date -->
          <div class="mb-3">
            <label class="form-label text-muted small fw-medium">Signature Date</label>
            <input type="date" formControlName="dateSignature" class="form-control bg-light"
                   [class.is-invalid]="contractForm.get('dateSignature')?.touched && contractForm.get('dateSignature')?.invalid">
            <div class="text-danger small mt-1" *ngIf="contractForm.get('dateSignature')?.touched && contractForm.get('dateSignature')?.hasError('required')">Date is required.</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1 py-2 rounded-3">Register Contract</button>
            <a [routerLink]="['/dashboard']" class="btn btn-light border py-2 px-4 rounded-3">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
