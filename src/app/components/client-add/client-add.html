<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card p-4 p-md-5 border-0 shadow-sm">
        <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
          <div class="bg-primary text-white p-2 rounded d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
            <i class="bi bi-person-fill-add fs-4"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0">Client Registration</h4>
            <p class="text-muted mb-0 small">Create a new client and configure communication lines</p>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mb-3">{{ errorMessage }}</div>

        <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label text-muted small fw-medium">Client Name</label>
            <input type="text" formControlName="name" class="form-control bg-light" placeholder="Jane Doe"
                   [class.is-invalid]="clientForm.get('name')?.touched && clientForm.get('name')?.invalid">
            <div class="text-danger small mt-1" *ngIf="clientForm.get('name')?.touched && clientForm.get('name')?.hasError('required')">Name is required.</div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-medium">Email Address</label>
            <input type="email" formControlName="email" class="form-control bg-light" placeholder="jane@example.com"
                   [class.is-invalid]="clientForm.get('email')?.touched && clientForm.get('email')?.invalid">
            <div class="text-danger small mt-1" *ngIf="clientForm.get('email')?.touched && clientForm.get('email')?.hasError('required')">Email is required.</div>
            <div class="text-danger small mt-1" *ngIf="clientForm.get('email')?.touched && clientForm.get('email')?.hasError('email')">Invalid email format.</div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted small fw-medium">Description / Notes</label>
            <textarea formControlName="description" class="form-control bg-light" rows="3" placeholder="Key details..."></textarea>
          </div>

          <!-- Dynamic Phone List -->
          <div class="mb-4 p-3 bg-light rounded-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <label class="form-label mb-0 text-muted fw-bold small"><i class="bi bi-phone-fill me-1 text-primary"></i> Contact Lines</label>
              <button type="button" (click)="addPhoneField()" class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1">
                <i class="bi bi-plus"></i> Add Number
              </button>
            </div>
            
            <div formArrayName="phones">
              @for (phoneGroup of phones.controls; track $index; let i = $index) {
                <div [formGroupName]="i" class="input-group mb-2">
                  <input type="text" formControlName="phoneNumber" class="form-control" placeholder="8-digit Tunisian number"
                         [class.is-invalid]="phoneGroup.get('phoneNumber')?.touched && phoneGroup.get('phoneNumber')?.invalid">
                  <button type="button" (click)="removePhoneField(i)" class="btn btn-danger">Delete</button>
                </div>
                <div class="text-danger small mb-2" *ngIf="phoneGroup.get('phoneNumber')?.touched && phoneGroup.get('phoneNumber')?.invalid">
                  Must be exactly 8 digits.
                </div>
              }
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1 py-2 rounded-3">Save Registration</button>
            <a [routerLink]="['/dashboard']" class="btn btn-light border py-2 px-4 rounded-3">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
